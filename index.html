<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blinq</title>
<meta name="theme-color" content="#19191b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blinq">
<style>
/* Layout: Handy App, Kopfzeile oben, Inhalt scrollt, Tableiste unten. Bewusst nur dunkel wie die Mac App. */
:root {
  --bg: #111112;
  --panel: #19191b;
  --card: #232326;
  --card2: #2c2c30;
  --line: rgba(255,255,255,0.08);
  --fg: #f4f4f5;
  --muted: rgba(244,244,245,0.55);
  --accent: #4fd936;
  --accent-ink: #0b1a07;
  --accent-soft: rgba(79,217,54,0.15);
  --red: #f04545;
  --yellow: #f9bf24;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --orange: #f59e0b;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
.app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top, 0px); max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 600px) { .app { border-inline: 1px solid var(--line); } }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
  background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top img { height: 24px; width: auto; display: block; }
.brand { font-family: var(--display); font-weight: 650; font-size: 19px; letter-spacing: -0.01em; }
.shoot { margin-left: auto; text-align: right; min-width: 0; }
.shoot b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shoot span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card); flex: none; }
.iconbtn svg { width: 18px; height: 18px; }

main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: flex; flex-direction: column; gap: 12px; }

.chips { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 12px; border-radius: 99px; background: var(--card); font-size: 13px; font-weight: 550; display: flex; gap: 6px; white-space: nowrap; }
.chip b { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.on { background: var(--fg); color: #000; } .chip.on b { color: rgba(0,0,0,.5); }

.stage { position: relative; border-radius: 10px; overflow: hidden; background: #000; touch-action: pan-y; }
.stage .frame { position: relative; margin: 0 auto; }
.stage img.main { display: block; width: 100%; height: 100%; object-fit: contain; }
.badge { position: absolute; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  background: rgba(0,0,0,.6); padding: 6px 9px; border-radius: 8px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.badge.tl { top: 8px; left: 8px; } .badge.tr { top: 8px; right: 8px; font-variant-numeric: tabular-nums; } .badge.bl { bottom: 8px; left: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.crop { position: absolute; border: 1.5px dashed rgba(255,255,255,.9); box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; }
.crop span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,.65); padding: 3px 6px; border-radius: 99px; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); font-size: 20px; }
.nav.l { left: 8px; } .nav.r { right: 8px; }

.strip { display: flex; gap: 6px; overflow-x: auto; margin-inline: -16px; padding: 0 16px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.th { position: relative; flex: none; width: 64px; height: 48px; border-radius: 6px; overflow: hidden; background: #000; }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th.sel { box-shadow: inset 0 0 0 2.5px var(--accent); } .th.sel img { padding: 2.5px; border-radius: 6px; }
.th.dim img { opacity: .45; }
.th .ld { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.label { font-size: 12.5px; color: var(--muted); }
.stars { display: flex; gap: 2px; }
.stars button { font-size: 26px; line-height: 1; color: rgba(255,255,255,.22); padding: 2px; }
.stars button.on { color: var(--yellow); }
.colors { display: flex; gap: 12px; }
.colors button { width: 22px; height: 22px; border-radius: 50%; }
.colors button.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px #fff; }
.decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn { border-radius: 11px; padding: 12px 10px; font-size: 14.5px; font-weight: 600; background: var(--card); display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn.go { background: var(--accent); color: var(--accent-ink); }
.btn.white { background: #fff; color: #000; }
.btn:active { transform: scale(.98); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; min-width: 0; }
.check i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; flex: none; }
.check i.ok { color: var(--accent); background: var(--accent-soft); }
.check i.no { color: var(--red); background: rgba(240,69,69,.15); }
.check i.na { color: var(--muted); background: rgba(255,255,255,.08); }
.meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.45; }
.tips { display: flex; flex-direction: column; gap: 8px; }
.tip { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; }
.tip i { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: var(--orange); background: rgba(245,158,11,.15); }
.tip i.ai { color: #9cc8ff; background: rgba(59,130,246,.18); }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-inline: -12px; }
.cell { position: relative; aspect-ratio: 1; background: #000; overflow: hidden; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell.dim img { opacity: .5; }
.cell .mini { position: absolute; left: 4px; bottom: 4px; font-size: 9px; letter-spacing: 1px; color: var(--yellow); background: rgba(0,0,0,.55); padding: 2px 5px; border-radius: 99px; }
.cell .cd { position: absolute; top: 5px; left: 5px; width: 10px; height: 10px; box-shadow: 0 0 0 2px rgba(0,0,0,.5); }

.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.hero h2 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 650; text-wrap: balance; }
.hero p, .note { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.note { font-size: 12.5px; }
ol.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
ol.steps b { color: var(--fg); font-weight: 600; }
.bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .2s; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.toggle small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.sw { width: 46px; height: 28px; border-radius: 99px; background: #3a3a3e; position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw.on { background: var(--accent); } .sw.on::after { transform: translateX(18px); }
.dest { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 11px; padding: 12px; text-align: left; width: 100%; }
.dest .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800; flex: none; background: var(--accent-soft); color: var(--accent); }
.dest div { min-width: 0; font-size: 14.5px; font-weight: 600; }
.dest small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.dest .chev { margin-left: auto; color: var(--muted); }
h3 { margin: 6px 0 0; font-size: 15px; font-weight: 650; }
.range { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.range input { width: 100%; accent-color: var(--accent); }
.range .ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
select { background: var(--card); border: 0; border-radius: 9px; padding: 8px 10px; }
.empty { text-align: center; padding: 40px 10px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty img { height: 44px; }
.empty h2 { margin: 0; font-family: var(--display); font-size: 21px; }
.empty p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 34ch; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 5px 0; }
.tabs svg { width: 23px; height: 23px; }
.tabs button.on { color: var(--fg); } .tabs button.on svg { color: var(--accent); }

.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.5); }
.sheet[hidden] { display: none !important; }
.sheet .inner { margin-top: env(safe-area-inset-top, 0px); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; background: var(--panel); border-radius: 16px 16px 0 0;
  padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.sheet .head { display: flex; align-items: center; justify-content: space-between; }
.sheet .head b { font-size: 17px; }
.toast { position: absolute; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0;
  width: min(440px, calc(100% - 32px)); background: #fff; color: #000; font-size: 13.5px; font-weight: 500; line-height: 1.4;
  padding: 11px 14px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: all .25s ease; pointer-events: none; z-index: 40; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.part { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 11px; padding: 10px 12px; }
.undo { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 45;
  width: min(440px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; background: #fff; color: #000; border-radius: 12px;
  padding: 10px 10px 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 14px; font-weight: 500; }
.undo span { flex: 1; } .undo button { background: #000; color: #fff; border-radius: 9px; padding: 8px 12px; font-weight: 600; font-size: 13.5px; }
.btn.danger { background: rgba(240,69,69,.16); color: #ff8a8a; }
.part div { flex: 1; min-width: 0; font-size: 14px; } .part small { display: block; color: var(--muted); font-size: 12px; }
.part .btn { padding: 9px 14px; font-size: 13.5px; }
input.key { width: 100%; background: var(--card); border: 0; border-radius: 9px; padding: 10px; font-size: 14px; }

/* Startanimation: Logo erscheint, Auge blinzelt, Haken leuchtet, Schriftzug kommt dazu */
#splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; animation: splashOut .4s ease 1.75s forwards; }
#splash .mark { position: relative; width: 132px; animation: pop .55s cubic-bezier(.2,.9,.3,1.25) both; }
#splash .mark img { display: block; width: 100%; transform-origin: 50% 55%; animation: blink .34s ease-in-out .72s both; }
#splash .mark::after { content: ""; position: absolute; left: 68%; top: 52%; width: 70px; height: 70px; border-radius: 50%; transform: translate(-50%, -50%) scale(.2);
  background: radial-gradient(circle, rgba(79,217,54,.55), rgba(79,217,54,0) 70%); opacity: 0; animation: glow .7s ease-out 1.05s both; }
#splash .word { font-family: var(--display); font-size: 34px; font-weight: 650; letter-spacing: -0.01em; animation: rise .45s ease-out .95s both; }
@keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
@keyframes blink { 0% { transform: scaleY(1); } 45% { transform: scaleY(.06); } 100% { transform: scaleY(1); } }
@keyframes glow { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { #splash { animation: splashOut .2s ease .6s forwards; } #splash * { animation: none !important; } }
</style>
</head>

const DB = {

// ---------- EXIF (Aufnahmezeit, Kameradaten) ----------
function readExif(buf) {

    const p = { id, name: f.name, size: f.size, added: Date.now() + added, blob: f, thumb: null, a: null };

}

  S.filter = "keepers"; S.sel = null; cull(); render();

async function setMain(p) {
  if (S.mainFor === p.id && S.mainURL) return;
  const blob = await blobOf(p);
  if (S.mainURL) URL.revokeObjectURL(S.mainURL);
  S.mainURL = blob ? URL.createObjectURL(blob) : null; S.mainFor = p.id;
  const img = $("#mainImg"); if (img && S.mainURL && S.sel === p.id) img.src = S.mainURL;
}
function renderFotos() {
  const m = $("#main");
  if (!S.photos.length) { m.innerHTML = `<section class="view">${progressHTML()}${emptyHTML()}</section>`; return; }
  const list = filtered(), p = current();
  let html = `<section class="view">${progressHTML()}${chipsHTML()}`;
  if (!p) { m.innerHTML = html + `<p class="note">In diesem Filter liegt gerade nichts.</p></section>`; return; }
  const idx = list.indexOf(p), a = p.a, crop = cropOf(p);
  const ratio = a ? a.W / a.H : 1.5;
  html += `<div class="stage" id="stage"><div class="frame" style="aspect-ratio:${ratio};max-height:56vh;max-width:min(100%, calc(56vh * ${ratio}))">
      <img class="main" id="mainImg" alt="${esc(p.name)}" src="${S.mainFor === p.id && S.mainURL ? S.mainURL : (p.thumb || "")}">
      ${crop ? `<div class="crop" style="left:${crop.x * 100}%;top:${crop.y * 100}%;width:${crop.w * 100}%;height:${crop.h * 100}%"><span>Zuschnitt · ${Math.round(crop.mp)} MP</span></div>` : ""}
      <span class="badge tl"><span class="dot" style="background:${CAT[p.eff || "none"].c}"></span>${CAT[p.eff || "none"].t}${p.manualCat ? " · manuell" : ""}</span>
      <span class="badge tr">${idx + 1} von ${list.length}</span>
      ${p.groupSize > 1 ? `<span class="badge bl">Serie mit ${p.groupSize} Bildern</span>` : ""}
    </div>

    <div class="strip" id="strip">${list.map(x => `<button class="th ${x.id === p.id ? "sel" : ""} ${x.a && !isKeeper(x) && x.id !== p.id ? "dim" : ""}" data-sel="${esc(x.id)}" aria-label="${esc(x.name)}">${x.thumb ? `<img src="${x.thumb}" alt="">` : ""}${x.label && x.id !== p.id ? `<span class="dot ld" style="background:${LABELS[x.label]}"></span>` : ""}</button>`).join("")}</div>
    <div class="panel">
      <div class="row"><div class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-star="${n}" class="${n <= (p.stars || 0) ? "on" : ""}" aria-label="${n} Sterne">★</button>`).join("")}</div>
        <div class="colors">${Object.entries(LABELS).map(([k, c]) => `<button data-label="${k}" class="${p.label === k ? "on" : ""}" style="background:${c}" aria-label="Farbe ${k}"></button>`).join("")}</div></div>
      <div class="decide"><button class="btn go" data-set="selected">✓ Behalten</button><button class="btn" data-set="highlight">✦ Highlight</button><button class="btn" data-set="rejected">✕ Ablehnen</button></div>
      ${a ? detailsHTML(p) : `<p class="note">Wird gerade analysiert …</p>`}
    </div></section>`;
  m.innerHTML = html;
  setMain(p);
  const sel = $("#strip .sel"); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}
function detailsHTML(p) {
  const a = p.a, ai = p.ai, crop = cropOf(p);
  const c = (ok, yes, no) => `<div class="check"><i class="${ok ? "ok" : "no"}">${ok ? "✓" : "✕"}</i><span>${ok ? yes : no}</span></div>`;
  const na = t => `<div class="check"><i class="na">–</i><span>${t}</span></div>`;
  let checks = c(!isBlurred(p), "Scharf · " + pct(sharpScore(a)), "Unscharf · " + pct(sharpScore(a)));
  checks += c(!isBadExpo(p), "Gute Belichtung", "Belichtung prüfen");
  checks += c(p.groupSize <= 1, "Kein Serienbild", `Serie mit ${p.groupSize}`);
  if (ai) {
    checks += S.settings.sport ? c(!ai.cut, "Nicht abgeschnitten", "Abgeschnitten") : c(!ai.eyesClosed, "Augen offen", "Augen zu");
    if (S.settings.sport) checks += `<div class="check"><i class="ok">⚡</i><span>Action ${ai.action}/10</span></div>`;
  } else checks += na("KI noch nicht geprüft");
  const t = tips(p), line = settingsLine(a);
  return `<div><div class="label" style="margin-bottom:8px">Erkannt als</div><div class="checks">${checks}</div></div>
    ${ai && ai.note ? `<div class="tips"><div class="tip"><i class="ai">KI</i><span>${esc(ai.note)}</span></div></div>` : ""}
    ${line ? `<div class="meta">${esc(p.name)} · ${(p.size / 1e6).toFixed(1).replace(".", ",")} MB · ${a.W} × ${a.H}<br>${esc(line)}</div>` : `<div class="meta">${esc(p.name)} · ${a.W} × ${a.H}</div>`}
    ${t.length ? `<div class="tips">${t.map(x => `<div class="tip"><i>!</i><span>${esc(x)}</span></div>`).join("")}</div>` : ""}
    ${crop ? `<button class="btn" data-act="saveCrop">Zuschnitt speichern (${Math.round(crop.mp)} MP)</button>` : ""}`;
}
function renderResults() {
  const list = filtered(), keep = S.photos.filter(isKeeper).length;
  $("#main").innerHTML = `<section class="view">${progressHTML()}
    <div class="summary"><div class="stat"><b>${keep}</b><span>behalten</span></div><div class="stat"><b>${count("highlight")}</b><span>Highlights</span></div><div class="stat"><b>${S.photos.filter(p => p.a).length - keep}</b><span>aussortiert</span></div></div>
    ${chipsHTML()}
    ${S.photos.length ? "" : `<p class="note">Noch keine Fotos. Unter Import auswählen.</p>`}
    <div class="grid">${list.map(p => `<button class="cell ${p.a && !isKeeper(p) ? "dim" : ""}" data-open="${esc(p.id)}" aria-label="${esc(p.name)}">${p.thumb ? `<img src="${p.thumb}" alt="" loading="lazy">` : ""}${p.a ? `<span class="dot cd" style="background:${CAT[p.eff].c}"></span>` : ""}${p.stars ? `<span class="mini">${STARS(p.stars)}</span>` : ""}</button>`).join("")}</div>
  </section>`;
}
function renderImport() {

  $("#main").innerHTML = `<section class="view">${progressHTML()}
    <div class="hero"><h2>Fotos aus der Creators' App</h2>
      <ol class="steps"><li>In der <b>Creators' App</b> die Bilder wie gewohnt aufs iPhone übertragen, am besten in <b>Originalgröße</b>.</li>

      <li>Danach in der Fotos App das Album öffnen, alle auswählen und löschen. So liegen die Bilder nur noch in Blinq.</li></ol>
      <button class="btn go" data-act="pick">Fotos auswählen</button>

    <div class="panel">
      <div class="toggle"><span>Sportmodus<small>Strenger bei Bewegungsunschärfe, Zuschnitt für kleine Sportler, Action zählt mit</small></span><button class="sw ${S.settings.sport ? "on" : ""}" data-toggle="sport" aria-label="Sportmodus"></button></div>
      ${S.settings.sport ? `<div class="toggle"><span>Zuschnitt vorschlagen<small>Wenn der Sportler klein im Bild ist (z. B. mit 75 bis 105 mm)</small></span><button class="sw ${S.settings.crop ? "on" : ""}" data-toggle="crop" aria-label="Zuschnitt"></button></div>` : ""}
    </div>
    <div class="panel">
      <div class="row"><b style="font-size:15px">KI Prüfung</b><span class="label">${ai} von ${S.photos.length} geprüft</span></div>
      <p class="note">Claude schaut sich deine ausgewählten Fotos an und erkennt, was ein Browser allein nicht sieht: geschlossene Augen, abgeschnittene Personen, ${S.settings.sport ? "Action im Moment und wo der Sportler steht (für einen genaueren Zuschnitt)" : "Ausdruck und Moment"}. Pro Tipp bis zu 24 Fotos. ${aiAvailable() ? "" : "Dafür zuerst in den Einstellungen deinen API Schlüssel eintragen."}</p>
      <button class="btn" data-act="ai" ${!keep || S.aiBusy || S.busy ? "disabled" : ""}>${S.aiBusy ? "KI prüft …" : "Auswahl mit KI prüfen"}</button>
    </div>

      <div class="row"><b style="font-size:15px">Shooting</b><span class="label" id="usage">${S.photos.length} Fotos</span></div>
      <label class="range" for="shootname">Name<input id="shootname" value="${esc(S.shoot)}" style="background:var(--card);border:0;border-radius:9px;padding:9px 10px"></label>
      <div class="decide" style="grid-template-columns:1fr 1fr"><button class="btn" data-act="dropRejected" ${S.photos.length ? "" : "disabled"}>Aussortierte löschen</button><button class="btn danger" data-act="deleteAll" ${S.photos.length ? "" : "disabled"}>Alle Fotos löschen</button></div>
      <p class="note">${DB.ok ? "Fotos bleiben in Blinq gespeichert, auch nach dem Schließen." : "Safari erlaubt hier keinen Speicher. Fotos bleiben nur, bis du Blinq schließt."}</p>
    </div></section>`;
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e => { const u = $("#usage"); if (u && e.usage) u.textContent = `${S.photos.length} Fotos · ${(e.usage / 1e9).toFixed(2).replace(".", ",")} GB`; }).catch(() => {});
}
function renderExport() {
  const keep = S.photos.filter(isKeeper).length, crops = S.photos.filter(p => isKeeper(p) && cropOf(p)).length;
  const parts = (S.parts || []).filter(p => !p.hidden);
  $("#main").innerHTML = `<section class="view">${progressHTML()}
    ${parts.length && !S.busy ? `<div class="panel"><b style="font-size:15px">Bereit zum Teilen</b>
      ${parts.map((p, i) => `<div class="part"><div>${esc(p.label)}<small>${esc(p.info)}</small></div><button class="btn ${p.done ? "" : "go"}" data-share="${i}">${p.done ? "Nochmal" : "Teilen"}</button></div>`).join("")}
      <p class="note">Im Teilen Menü <b>Lightroom</b> wählen, dann landen die Fotos direkt im Import. Oder „Bilder sichern“ bzw. „In Dateien sichern“.</p></div>` : ""}
    <h3>An Lightroom übergeben</h3>
    <button class="dest" data-act="prepShare" ${keep && !S.busy ? "" : "disabled"}><span class="ic">Lr</span><div>Auswahl teilen<small>${keep} Fotos als Originale, in Teilen zu je 25, direkt an Lightroom</small></div><span class="chev">›</span></button>
    ${S.settings.sport ? `<button class="dest" data-act="prepCrop" ${keep && !S.busy ? "" : "disabled"}><span class="ic">⌗</span><div>Auswahl mit Zuschnitt teilen<small>${crops} von ${keep} Fotos werden zugeschnitten, mindestens ${S.settings.minMP} MP</small></div><span class="chev">›</span></button>` : ""}
    <button class="dest" data-act="one" ${current() ? "" : "disabled"}><span class="ic">↗</span><div>Aktuelles Foto teilen<small>An Lightroom, Instagram oder Fotos</small></div><span class="chev">›</span></button>
    <button class="dest" data-act="prepZip" ${keep && !S.busy ? "" : "disabled"}><span class="ic">ZIP</span><div>Auswahl als ZIP<small>Mit Ordnern Highlights und Auswahl, zum Sichern in Dateien</small></div><span class="chev">›</span></button>
    <div class="panel"><b style="font-size:15px">Dein Preset in Lightroom</b>
      <ol class="steps"><li>In Lightroom ein importiertes Foto mit deinem Preset bearbeiten.</li><li>Oben auf ⋯ und <b>Einstellungen kopieren</b>.</li><li>In der Übersicht alle neuen Fotos markieren und <b>Einstellungen einfügen</b>.</li></ol></div>
    <h3>Fertig?</h3>
    <button class="btn danger" data-act="deleteAll" ${S.photos.length && !S.busy ? "" : "disabled"}>Alle ${S.photos.length} Fotos aus Blinq löschen</button>
    <p class="note">Gibt den Speicher sofort frei. 6 Sekunden lang kannst du es rückgängig machen.</p>
  </section>`;
}
function render() {
  renderTabs();
  $("#shootName").textContent = S.shoot;
  const keep = S.photos.filter(isKeeper).length;
  $("#shootInfo").textContent = S.photos.length ? `${keep} von ${S.photos.length} behalten${S.settings.sport ? " · Sport" : ""}` : "Noch keine Fotos";
  ({ fotos: renderFotos, results: renderResults, import: renderImport, export: renderExport })[S.tab]();
}
function openSettings() {
  const s = S.settings;
  const r = (id, label, val, min, max, step, l, rr) => `<label class="range" for="${id}">${label}<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span class="ends"><span>${l}</span><span>${rr}</span></span></label>`;
  $("#sheetInner").innerHTML = `<div class="head"><b>Einstellungen</b><button class="btn" data-act="closeSheet" style="padding:8px 14px">Fertig</button></div>
    ${r("set-blur", "Unschärfe", s.blur, 0, 1, 0.05, "locker", "streng")}
    ${r("set-expo", "Belichtung", s.expoTol, 0, 1, 0.05, "streng", "locker")}
    ${r("set-dupe", "Serien zusammenfassen", s.dupe, 0.1, 0.7, 0.05, "wenig", "viel")}
    <label class="range" for="set-gap">Höchstens ${s.gap} Sekunden zwischen Serienbildern<input type="range" id="set-gap" min="2" max="120" step="2" value="${s.gap}"></label>
    <label class="range" for="set-hl">Highlights: beste ${s.highlight} % der Auswahl<input type="range" id="set-hl" min="0" max="30" step="5" value="${s.highlight}"></label>
    <label class="range" for="set-mp">Zuschnitt: mindestens ${s.minMP} Megapixel<input type="range" id="set-mp" min="2" max="20" step="1" value="${s.minMP}"></label>
    <div class="toggle"><span>Aus jeder Serie ein Bild behalten</span><button class="sw ${s.keepOne ? "on" : ""}" data-toggle="keepOne" aria-label="Ein Bild pro Serie"></button></div>
    <div class="toggle"><span>Sport: Bilder ohne Person aussortieren<small>Braucht die KI Prüfung</small></span><button class="sw ${s.sportEmpty ? "on" : ""}" data-toggle="sportEmpty" aria-label="Ohne Person aussortieren"></button></div>
    <label class="range" for="set-sync">Blitzsynchronzeit deiner Kamera<select id="set-sync">${[160, 200, 250, 320].map(v => `<option value="${v}" ${v === s.sync ? "selected" : ""}>1/${v} s</option>`).join("")}</select></label>
    <p class="note">Sterne und Farben: Highlight 5 Sterne Blau, Ausgewählt 4 Grün, Duplikat 2 Gelb, aussortiert 1 Stern Rot, Augen zu Lila.</p>
    <div class="panel" style="padding:12px"><b style="font-size:15px">KI Prüfung</b>
      <p class="note">Für Augen zu, abgeschnittene Personen und Action schaut Claude sich die Fotos an. Dafür brauchst du einen eigenen Claude API Schlüssel (console.anthropic.com › API Keys). Das kostet pro geprüftem Foto etwa einen Cent. Der Schlüssel bleibt nur auf diesem Gerät.</p>
      <input class="key" id="apikey" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(apiKey())}">
      <button class="btn" data-act="saveKey">Schlüssel speichern</button></div>
    <button class="btn" data-act="reset">Standard wiederherstellen</button>
    <p class="note" style="text-align:center">Blinq Version 4</p>`;
  $("#sheet").hidden = false;
}

// ---------- Bedienung ----------
function move(d) { const list = filtered(); const i = list.findIndex(x => x.id === S.sel); const n = list[Math.min(list.length - 1, Math.max(0, i + d))]; if (n) { S.sel = n.id; renderFotos(); } }
function setCat(c) {
  const p = current(); if (!p) return;
  const list = filtered(), i = list.indexOf(p);
  p.manualCat = c; p.manualStars = null; markDirty(p); cull();
  const next = filtered(); const stay = next.includes(p);
  if (!stay || S.filter === "all") { const n = list[i + 1] || list[i - 1]; if (n && next.includes(n)) S.sel = n.id; }
  else { const n = next[next.indexOf(p) + 1]; if (n) S.sel = n.id; }
  render(); toast(`${p.name}: ${CAT[c].t}`, 1600);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) { if (e.target.id === "sheet") $("#sheet").hidden = true; return; }
  const d = b.dataset;
  if (d.tab) { S.tab = d.tab; saveUI(); render(); $("#main").scrollTop = 0; return; }
  if (d.filter) { S.filter = d.filter; S.sel = null; render(); return; }
  if (d.sel) { S.sel = d.sel; renderFotos(); return; }
  if (d.open) { S.sel = d.open; S.tab = "fotos"; if (!filtered().some(p => p.id === d.open)) S.filter = "all"; saveUI(); render(); return; }
  if (d.star) { const p = current(); const n = +d.star; p.manualStars = p.stars === n ? 0 : n; markDirty(p); cull(); renderFotos(); return; }
  if (d.label) { const p = current(); p.manualLabel = p.label === d.label ? null : d.label; markDirty(p); cull(); renderFotos(); return; }
  if (d.set) return setCat(d.set);
  if (d.share != null) { sharePart(+d.share); return; }
  if (d.toggle) { S.settings[d.toggle] = !S.settings[d.toggle]; saveSettings(); cull(); render(); if (!$("#sheet").hidden) openSettings(); return; }
  switch (d.act) {
    case "pick": $("#picker").value = ""; $("#picker").click(); break;
    case "prev": move(-1); break;
    case "next": move(1); break;
    case "ai": aiCheck(); break;
    case "prepShare": prepareExport("share"); break;
    case "prepCrop": prepareExport("crop"); break;
    case "prepZip": prepareExport("zip"); break;
    case "one": shareCurrent(); break;
    case "saveCrop": prepareExport("current"); break;
    case "saveKey": { const v = ($("#apikey")?.value || "").trim(); try { v ? localStorage.setItem("blinq.key", v) : localStorage.removeItem("blinq.key"); } catch (e) {} toast(v ? "API Schlüssel gespeichert. Nur auf diesem iPhone." : "API Schlüssel entfernt."); render(); break; }
    case "dropRejected": askConfirm(`${S.photos.filter(p => p.a && !isKeeper(p)).length} aussortierte Fotos aus Blinq löschen?`, () => clearAll(true)); break;
    case "clear": askConfirm(`Alle ${S.photos.length} Fotos aus Blinq löschen?`, () => clearAll(false)); break;
    case "closeSheet": $("#sheet").hidden = true; break;
    case "reset": S.settings = { ...DEFAULTS }; saveSettings(); cull(); render(); openSettings(); break;
    case "deleteAll": deleteAll(); break;
    case "undo": undoDelete(); break;
    case "confirmYes": $("#sheet").hidden = true; askConfirm.fn && askConfirm.fn(); break;
  }
});
function askConfirm(text, fn) {
  askConfirm.fn = fn;
  $("#sheetInner").innerHTML = `<div class="head"><b>Sicher?</b></div><p class="note" style="font-size:14.5px">${esc(text)} Das lässt sich nicht rückgängig machen.</p>
    <div class="decide" style="grid-template-columns:1fr 1fr"><button class="btn" data-act="closeSheet">Abbrechen</button><button class="btn" data-act="confirmYes" style="background:var(--red);color:#fff">Löschen</button></div>`;
  $("#sheet").hidden = false;
}
$("#openSettings").addEventListener("click", openSettings);
$("#picker").addEventListener("change", e => { if (e.target.files?.length) addFiles(e.target.files); });
document.addEventListener("input", e => {
  const t = e.target, s = S.settings;
  if (t.id === "apikey") return;
  const map = { "set-blur": ["blur", parseFloat], "set-expo": ["expoTol", parseFloat], "set-dupe": ["dupe", parseFloat], "set-gap": ["gap", parseInt], "set-hl": ["highlight", parseInt], "set-mp": ["minMP", parseInt] };
  if (map[t.id]) { const [k, f] = map[t.id]; s[k] = f(t.value); saveSettings(); cull(); render(); const lbl = t.closest("label"); if (lbl && ["set-gap", "set-hl", "set-mp"].includes(t.id)) lbl.firstChild.textContent = { "set-gap": `Höchstens ${s.gap} Sekunden zwischen Serienbildern`, "set-hl": `Highlights: beste ${s.highlight} % der Auswahl`, "set-mp": `Zuschnitt: mindestens ${s.minMP} Megapixel` }[t.id]; }
  if (t.id === "shootname") { S.shoot = t.value.trim() || "Shooting"; saveUI(); $("#shootName").textContent = S.shoot; }
});
document.addEventListener("change", e => { if (e.target.id === "set-sync") { S.settings.sync = parseInt(e.target.value); saveSettings(); render(); } });
let tx = null;
document.addEventListener("touchstart", e => { if (e.target.closest("#stage")) tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 45) move(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener("keydown", e => {
  if (S.tab !== "fotos" || e.target.matches("input, select")) return;
  if (e.key === "ArrowRight") move(1); else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "p") setCat("selected"); else if (e.key === "x") setCat("rejected"); else if (e.key === "h") setCat("highlight");
});

// ---------- Vollbild auf dem Home Bildschirm ----------
// iOS meldet im Vollbild eine um die Statusleiste zu kleine Höhe. Dann echte Bildschirmhöhe nehmen.
function fitStandalone() {
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const els = [$(".app"), $("#sheet"), $("#splash")].filter(Boolean);
  for (const el of els) { el.style.height = ""; el.style.bottom = ""; }
  if (!standalone) return;
  const land = innerWidth > innerHeight;
  const h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
  const gap = h - innerHeight;
  if (gap > 0 && gap <= 90) for (const el of els) { el.style.bottom = "auto"; el.style.height = h + "px"; }
}
addEventListener("resize", fitStandalone);
addEventListener("orientationchange", () => setTimeout(fitStandalone, 300));
fitStandalone();
setTimeout(() => { const s = $("#splash"); if (s) s.remove(); }, 2300);

// ---------- Start ----------
(async () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
  if (await DB.open()) {
    try { navigator.storage?.persist?.(); } catch (e) {}
    const metas = await DB.all("meta");
    S.photos = metas.map(m => ({ ...m, blob: null }));
    cull(); render();
    if (S.photos.some(p => !p.a)) analyzeAll();
  }
})();
</script>
